service: morta

frameworkVersion: "3"

provider:
  name: aws
  runtime: python3.12
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'prod'}
  environment:
    DATABASE_URL: ${env:DATABASE_URL}
    JWT_SECRET_KEY: ${env:JWT_SECRET_KEY}
    DD_SERVICE: morta
    DD_ENV: production
    DD_VERSION: ${env:DD_VERSION, '1.0.0'}
    DD_TRACE_ENABLED: ${env:DD_TRACE_ENABLED, 'true'}
    DD_SERVERLESS_LOGS_ENABLED: ${env:DD_SERVERLESS_LOGS_ENABLED, 'true'}

functions:
  api:
    handler: morta.lambda_handler.handler
    events:
      - httpApi: "*"

package:
  patterns:
    - "morta/**"

plugins:
  - serverless-python-requirements
  - serverless-plugin-datadog

custom:
  pythonRequirements:
    dockerizePip: true
    slim: false
    noDeps: false
  datadog:
    apiKey: ${env:DD_API_KEY}
    site: ${env:DD_SITE, 'datadoghq.com'}
    addLayers: true
    enableDDTracing: true
    enableDDLogs: true
