[project]
name = "morta"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alesson de Jesus", email = "asn9006@hotmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.16.5",
    "fastapi[standard]>=0.128.8",
    "mangum>=0.21.0",
    "psycopg[binary]>=3.2.13",
    "pwdlib[argon2]>=0.2.1",
    "pydantic[email,field]>=2.13.5",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.1",
    "sqlmodel>=0.0.34",
]

[project.scripts]
morta = "morta:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
